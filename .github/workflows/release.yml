name: Release

on:
  push:
    tags:
      # The repository tags releases without a "v" prefix (10.0.10)
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: 'nr-saml-auth'
      package-name: 'netresearch/nr-saml-auth'
      extension-key: 'nr_saml_auth'
      # tailor zips the working tree and ignores .gitattributes; this list
      # keeps agent instructions and repository tooling out of the TER zip.
      exclude-from-packaging: 'packaging_exclude.php'
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
