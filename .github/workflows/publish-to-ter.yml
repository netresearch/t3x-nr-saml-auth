name: Publish new extension version to TER

on:
  push:
    tags:
      - '*'
  # Publishes an existing tag to TER; creates no GitHub release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish to TER (e.g. "10.0.11")'
        required: true
        type: string

permissions: {}

jobs:
  # Job: Create release
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Check if tag is valid
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            exit 1
          fi

      # Create release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes

  # Job: Publish on TER
  ter-publish:
    needs: [release]
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TYPO3_EXTENSION_KEY: ${{ secrets.TYPO3_EXTENSION_KEY }}
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
      TYPO3_EXCLUDE_FROM_PACKAGING: packaging_exclude.php
    steps:
      # Check if tag is valid
      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 7.4
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2, typo3/tailor, clue/phar-composer

      - name: Reset files
        run: git reset --hard HEAD && git clean -dfx

      # PHAR files
      - name: Build PHAR file
        run: |
          composer install -d Resources/Private/Libs/Build
          composer global exec phar-composer build Resources/Private/Libs/Build Resources/Private/Libs/vendors.phar
      # Non-composer installations get the bundled libraries from the PHAR
      - name: Include PHAR file
        run: echo "require_once 'phar://' . \\TYPO3\\CMS\\Core\\Utility\\ExtensionManagementUtility::extPath('nr_saml_auth') . 'Resources/Private/Libs/vendors.phar/vendor/autoload.php';" >> ext_localconf.php

      # Release
      - name: Publish to TER
        run: |
          php ~/.composer/vendor/bin/tailor set-version "$TAG"
          php ~/.composer/vendor/bin/tailor ter:publish --comment="See release notes at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" "$TAG"
