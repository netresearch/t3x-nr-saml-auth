name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.1","8.2","8.3","8.4","8.5"]'
      # The non-matrixed CGL and Rector jobs install the full require-dev, and
      # netresearch/typo3-ci-workflows requires php ^8.2 — pin both jobs to 8.2
      # so the 8.1 support floor can lead the matrix in natural order.
      cgl-php-version: '8.2'
      rector-php-version: '8.2'
      typo3-versions: '["^12.4","^13.4"]'
      matrix-exclude: '[{"php":"8.1","typo3":"^13.4"},{"php":"8.5","typo3":"^12.4"}]'
      # The meta package is unresolvable under typo3/cms-core ^12.4, so the ^12.4
      # cells drop it. The Rector job is not TYPO3-matrixed and keeps it.
      remove-dev-deps: '[{"dep":"netresearch/typo3-ci-workflows","only-for":"^13.4|^14.3"}]'
      run-functional-tests: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
